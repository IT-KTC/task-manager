<div class="ap-pager">
<span>Trang {{ page_obj.number }}/{{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} kết quả</span>
<div>
{% if page_obj.has_previous %}<a href="?q={{ keyword|default:''|urlencode }}&state={{ state|default:'all'|urlencode }}&page={{ page_obj.previous_page_number }}">← Trước</a>{% endif %}
{% if page_obj.has_next %}<a href="?q={{ keyword|default:''|urlencode }}&state={{ state|default:'all'|urlencode }}&page={{ page_obj.next_page_number }}">Tiếp →</a>{% endif %}
</div></div>
