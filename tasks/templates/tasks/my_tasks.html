<!DOCTYPE html>
<html>
    <head>
        <title>Task Manager</title>
    </head>
    <body>

        <h1>My tasks</h1>

        <p>Welcome to my Django Task Manager {{username}}.</p>

        {% if my_tasks %}
        <ul>
            {% for task in my_tasks %}
            <li> {{ task }}</li>
            {% endfor %}
        </ul>
        {%else%}
        <li> nothing to do </li>
        {% endif %}
    </body>
</html>
